[profile.default]
src = 'contracts'
test = 'test'
out = 'out'
cache_path = 'forge-cache'
libs = ["../dependencies", "../lib"]
solc_version = '0.8.28'
evm_version = 'cancun'
optimizer_runs = 200
allow_paths = [".."]

[rpc_endpoints]
mainnet = "${RPC_URL_MAINNET}"
arbitrum = "${RPC_URL_ARBITRUM}"

[fuzz]
runs = 50
